name: Build Windows installer
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after inspecting Windows evidence
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archives = @(Get-ChildItem -File -Filter '*smartdine-candidate7.zip')
          if ($archives.Count -ne 1) { throw 'exactly one reviewed runtime archive required' }
          Remove-Item app,installer -Recurse -Force
          Expand-Archive $archives[0].FullName -DestinationPath . -Force
          if (-not (Test-Path app\sync.mjs)) { throw 'reviewed sync engine missing' }
      - name: Install NSIS (ephemeral, with retry)
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            try { choco install nsis -y --no-progress; $ok = $true } catch { Write-Host "choco attempt $i failed: $_"; Start-Sleep 10 }
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            $env:Path += ";C:\Program Files (x86)\NSIS"
          }
          makensis /VERSION
      - name: Download portable Node runtime and stage files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "v22.14.0"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$ver/node-$ver-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath .
          if (-not (Test-Path "node-$ver-win-x64\node.exe")) { throw "node runtime missing after expand" }
          New-Item -ItemType Directory -Force -Path installer\stage\node | Out-Null
          Copy-Item "node-$ver-win-x64\node.exe" installer\stage\node\
          Copy-Item -Recurse app installer\stage\app
          if (-not (Test-Path "installer\stage\app\server.mjs")) { throw "app staging failed" }
      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path += ";C:\Program Files (x86)\NSIS"
          Push-Location installer
          makensis smartdine.nsi
          Pop-Location
          Get-Item installer\SmartDinePOS-Setup.exe | Select-Object Name, Length
      - name: Smoke test - silent install, launch, API checks
        shell: pwsh
        run: |
          # Upgrade fixture: create real saved data with previously shipped v4/run5.
          Invoke-WebRequest 'https://github.com/choudharynoman00001/smartdine-installer/releases/download/v1.0.0-run5/SmartDinePOS-Setup.exe' -OutFile previous-setup.exe
          $expected = 'a705b77844e6b5f787fa9a6b8e991366bb42f2f75e04f879c0d8e01160996ab3'
          if ((Get-FileHash previous-setup.exe -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'previous release hash mismatch' }
          .\previous-setup.exe /S
          Start-Sleep 5
          $dir = "$env:LOCALAPPDATA\SmartDine"
          if (-not (Test-Path "$dir\node\node.exe")) { throw "install failed: node.exe missing" }
          if (-not (Test-Path "$dir\app\server.mjs")) { throw "install failed: app missing" }
          # launch via the ACTUAL shipped launcher (catches broken shortcut/bat, not just node)
          $env:SMARTDINE_NO_BROWSER = "1"
          $proc = Start-Process -PassThru -NoNewWindow "cmd.exe" -ArgumentList '/c', "`"$dir\SmartDine.bat`""
          Start-Sleep 3
          $node = Get-Process node -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $node) { throw "launcher did not start node" }
          $env:SMARTDINE_PID = $node.Id
          $up = $false
          for ($i = 0; $i -lt 30 -and -not $up; $i++) {
            Start-Sleep 1
            try { $h = Invoke-RestMethod http://localhost:8080/api/health; $up = $h.ok } catch {}
          }
          if (-not $up) { Get-Content "$dir\err.log" -ErrorAction SilentlyContinue; throw "server did not start" }
          Write-Host "HEALTH OK"
          # first-run setup: no default PINs exist; create the owner with a random PIN (never logged)
          $setup = Invoke-RestMethod http://localhost:8080/api/setup
          if (-not $setup.setup_required) { throw "fresh install should require setup" }
          $pin1 = -join ((1..6) | ForEach-Object { Get-Random -Minimum 0 -Maximum 10 })
          $login = Invoke-RestMethod -Method Post http://localhost:8080/api/setup -ContentType 'application/json' -Body (@{ name = "Smoke Owner"; pin = $pin1 } | ConvertTo-Json)
          $hdr = @{ authorization = "Bearer $($login.token)" }
          Write-Host "SETUP OK (owner created, PIN random+hidden)"
          # PIN change requires current PIN; rotate once
          $pin2 = -join ((1..6) | ForEach-Object { Get-Random -Minimum 0 -Maximum 10 })
          Invoke-RestMethod -Method Post http://localhost:8080/api/auth/change-pin -Headers $hdr -ContentType 'application/json' -Body (@{ pin = $pin2; current_pin = $pin1 } | ConvertTo-Json) | Out-Null
          Write-Host "PIN CHANGE OK"
          # write: fresh install has an empty menu - create category + item, then an order
          $cat = Invoke-RestMethod -Method Post http://localhost:8080/api/menu/categories -Headers $hdr -ContentType 'application/json' -Body '{"name_en":"Smoke","name_ur":"Smoke"}'
          $mi = Invoke-RestMethod -Method Post http://localhost:8080/api/menu/items -Headers $hdr -ContentType 'application/json' -Body (@{ name_en = "Smoke Item"; category_id = $cat.category.id; price = 100 } | ConvertTo-Json)
          $order = Invoke-RestMethod -Method Post http://localhost:8080/api/orders -Headers $hdr -ContentType 'application/json' -Body (@{ order_type = "takeaway"; items = @(@{ menu_item_id = $mi.item.id; qty = 1 }) } | ConvertTo-Json -Depth 4)
          Write-Host "WRITE OK order=$($order.order.id)"
          $order.order.id | Out-File "$dir\smoke-order.txt"
          $pin2 | Out-File "$dir\smoke-pin.txt"
          # stop + restart
          Stop-Process -Id $env:SMARTDINE_PID -Force
          Start-Sleep 2
          $proc2 = Start-Process -PassThru -NoNewWindow "cmd.exe" -ArgumentList '/c', "`"$dir\SmartDine.bat`""
          $up = $false
          for ($i = 0; $i -lt 30 -and -not $up; $i++) {
            Start-Sleep 1
            try { $h = Invoke-RestMethod http://localhost:8080/api/health; $up = $h.ok } catch {}
          }
          if (-not $up) { throw "server did not restart" }
          # readback: order survived restart
          $login2 = Invoke-RestMethod -Method Post http://localhost:8080/api/auth/login -ContentType 'application/json' -Body (@{ pin = $pin2 } | ConvertTo-Json)
          $orders = Invoke-RestMethod http://localhost:8080/api/orders -Headers @{ authorization = "Bearer $($login2.token)" }
          $oid = Get-Content "$dir\smoke-order.txt"
          if (-not ($orders.orders | Where-Object { $_.id -eq $oid })) { throw "readback failed: order lost after restart" }
          Write-Host "RESTART+READBACK OK"
          if ($proc2 -and -not $proc2.HasExited) { Stop-Process -Id $proc2.Id -Force -ErrorAction SilentlyContinue }
      - name: Upgrade preservation and real app-window launcher proof
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:LOCALAPPDATA\SmartDine"
          $owned = Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.ExecutablePath -eq "$dir\node\node.exe" -and $_.CommandLine -like '*server.mjs*' }
          $owned | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Write-Host 'CANDIDATE-INSTALL-START'
          $install = Start-Process .\installer\SmartDinePOS-Setup.exe -ArgumentList '/S' -PassThru
          if (-not $install.WaitForExit(60000)) { throw 'candidate silent installer timed out' }
          Write-Host "CANDIDATE-INSTALL-EXIT $($install.ExitCode)"
          if ($install.ExitCode -ne 0) { throw 'candidate install failed' }
          Start-Sleep -Seconds 3
          $env:SMARTDINE_NO_BROWSER = '1'
          Write-Host 'LAUNCHER-START (bounded cscript process-only wait)'
          $launch = Start-Process cscript.exe -ArgumentList "//nologo `"$dir\launcher.vbs`"" -PassThru
          if (-not $launch.WaitForExit(60000)) { throw "shipped launcher timed out" }
          $pin = (Get-Content "$dir\smoke-pin.txt" -Raw).Trim()
          $login = Invoke-RestMethod -Method Post http://127.0.0.1:8080/api/auth/login -ContentType 'application/json' -Body (@{pin=$pin} | ConvertTo-Json)
          $orders = Invoke-RestMethod http://127.0.0.1:8080/api/orders -Headers @{authorization="Bearer $($login.token)"}
          $oid = (Get-Content "$dir\smoke-order.txt" -Raw).Trim()
          if (-not ($orders.orders | Where-Object id -eq $oid)) { throw 'upgrade lost existing order' }
          Write-Host 'UPGRADE-PRESERVATION-OK'
          & .\installer\appwindow-proof.ps1 -InstallDir $dir
      - name: Installed UI screenshots (headless Chrome against the installed app)
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:LOCALAPPDATA\SmartDine"
          $env:SMARTDINE_NO_BROWSER = "1"
          $up = $false
          try { $h = Invoke-RestMethod http://localhost:8080/api/health; $up = $h.ok } catch {}
          if (-not $up) {
            $proc = Start-Process -PassThru "cscript.exe" -ArgumentList "//nologo `"$dir\launcher.vbs`""
            for ($i = 0; $i -lt 30 -and -not $up; $i++) {
              Start-Sleep 1
              try { $h = Invoke-RestMethod http://localhost:8080/api/health; $up = $h.ok } catch {}
            }
          }
          if (-not $up) { throw "installed app not reachable for screenshots" }
          Write-Host "INSTALLED APP REACHABLE (launched via shipped launcher.vbs)"
          Set-Location $env:RUNNER_TEMP
          npm init -y | Out-Null
          npm install puppeteer-core --no-fund --no-audit | Out-Null
          $env:SMOKE_PIN = (Get-Content "$dir\smoke-pin.txt" -Raw).Trim()
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\shot.cjs", [Convert]::FromBase64String(""))
          node shot.cjs
          foreach ($f in 'installed-desktop.jpg','installed-mobile.jpg') {
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:RUNNER_TEMP\$f"))
            Write-Host "SHOT_B64_BEGIN $f"
            for ($i = 0; $i -lt $b.Length; $i += 900) { Write-Host $b.Substring($i, [Math]::Min(900, $b.Length - $i)) }
            Write-Host "SHOT_B64_END $f"
          }
          if ($proc) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
      - name: Fresh candidate install verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:LOCALAPPDATA\SmartDine"
          # CI-only cleanup. Match this install's exact binary/script or exact
          # hidden-server cmd redirection. Never kill unrelated node/cmd/browser.
          $ownedNode = @(Get-CimInstance Win32_Process -Filter "Name='node.exe'" | Where-Object { $_.ExecutablePath -eq "$dir\node\node.exe" -and $_.CommandLine -and $_.CommandLine.Contains("$dir\app\server.mjs") })
          $ownedShell = @(Get-CimInstance Win32_Process -Filter "Name='cmd.exe'" | Where-Object { $_.ExecutablePath -eq "$env:SystemRoot\System32\cmd.exe" -and $_.CommandLine -and $_.CommandLine.Contains("$dir\app") -and $_.CommandLine.Contains("$dir\app\data\server.log") })
          $evidence = Join-Path $env:RUNNER_TEMP 'smartdine-cleanup.txt'
          "CI-owned node count=$($ownedNode.Count) shell count=$($ownedShell.Count)" | Tee-Object -FilePath $evidence
          foreach ($p in @($ownedNode) + @($ownedShell)) {
            "Stopping scoped process id=$($p.ProcessId) name=$($p.Name)" | Tee-Object -FilePath $evidence -Append
            Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
          }
          # Only synthetic CI install, after upgrade and screenshot evidence.
          # Retry only file-handle release, with finite total15s wait.
          $removed = $false
          for ($attempt=1; $attempt -le 3 -and -not $removed; $attempt++) {
            try { Remove-Item $dir -Recurse -Force -ErrorAction Stop; $removed=$true }
            catch { "Delete attempt=$attempt failed, waiting for scoped handle release" | Tee-Object -FilePath $evidence -Append; Start-Sleep -Seconds 5 }
          }
          if (-not $removed) { throw 'synthetic install removal still blocked; fresh install NOT tested' }
          Write-Host 'CANDIDATE-INSTALL-START'
          $install = Start-Process .\installer\SmartDinePOS-Setup.exe -ArgumentList '/S' -PassThru
          if (-not $install.WaitForExit(60000)) { throw 'candidate silent installer timed out' }
          Write-Host "CANDIDATE-INSTALL-EXIT $($install.ExitCode)"
          if ($install.ExitCode -ne 0) { throw 'candidate install failed' }
          Start-Sleep -Seconds 3
          $env:SMARTDINE_NO_BROWSER='1'
          Write-Host 'LAUNCHER-START (bounded cscript process-only wait)'
          $launch = Start-Process cscript.exe -ArgumentList "//nologo `"$dir\launcher.vbs`"" -PassThru
          if (-not $launch.WaitForExit(60000)) { throw "shipped launcher timed out" }
          $s = Invoke-RestMethod http://127.0.0.1:8080/api/setup
          if (-not $s.setup_required) { throw 'fresh candidate unexpectedly configured' }
          $pin = -join ((1..8) | ForEach-Object { Get-Random -Minimum 0 -Maximum 10 })
          $a = Invoke-RestMethod -Method Post http://127.0.0.1:8080/api/setup -ContentType 'application/json' -Body (@{name='Candidate Owner';pin=$pin}|ConvertTo-Json)
          if (-not $a.token) { throw 'fresh candidate setup failed' }
          Write-Host 'FRESH-CANDIDATE-SETUP-OK'
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartdine-installed-evidence
          if-no-files-found: warn
          path: |
            installer/SmartDinePOS-Setup.exe
            ${{ runner.temp }}/smartdine-cleanup.txt
            ${{ runner.temp }}/installed-desktop.jpg
            ${{ runner.temp }}/installed-mobile.jpg
